<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="d_ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#a8a49c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="d_arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#5aa87c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 1. trigger -->
  <rect x="150" y="20" width="440" height="72" rx="11" fill="#eceae1" stroke="#b8b4a4" stroke-width="1.6"/>
  <text x="370" y="50" text-anchor="middle" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#4f4c44">preinstall → node setup.mjs</text>
  <text x="370" y="74" text-anchor="middle" font-size="14" fill="#8d8981">fires on npm install keyv@6.0.0</text>
  <path d="M370,92 L370,118" fill="none" stroke="#a8a49c" stroke-width="1.9" marker-end="url(#d_ar)"/>

  <!-- 2. bun check -->
  <rect x="150" y="122" width="440" height="72" rx="11" fill="#f4f2ec" stroke="#c8c3b6" stroke-width="1.5"/>
  <text x="370" y="152" text-anchor="middle" font-size="17" fill="#4f4c44">is Bun already installed?</text>
  <text x="370" y="176" text-anchor="middle" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8d8981">bun --version</text>

  <!-- yes branch -->
  <path d="M590,158 L700,158 L700,601 L636,601" fill="none" stroke="#5aa87c" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#d_arg)"/>
  <text x="712" y="392" font-size="13.5" fill="#2b7a4b" font-style="italic">straight to stage 2</text>
  <rect x="712" y="130" width="150" height="56" rx="10" fill="#d9efe2" stroke="#86c8a5" stroke-width="1.5"/>
  <text x="787" y="163" text-anchor="middle" font-size="15" fill="#2b7a4b">skip download</text>
  <text x="646" y="150" text-anchor="middle" font-size="13.5" fill="#2b7a4b" font-style="italic">yes</text>

  <text x="392" y="212" font-size="13.5" fill="#8d8981" font-style="italic">not found</text>
  <path d="M370,194 L370,224" fill="none" stroke="#a8a49c" stroke-width="1.9" marker-end="url(#d_ar)"/>

  <!-- 3. detect OS -->
  <rect x="150" y="228" width="440" height="80" rx="11" fill="#f4f2ec" stroke="#c8c3b6" stroke-width="1.5"/>
  <text x="370" y="256" text-anchor="middle" font-size="17" fill="#4f4c44">detect OS &amp; architecture</text>
  <text x="370" y="280" text-anchor="middle" font-size="13.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8d8981">ldd --version · /etc/os-release</text>
  <text x="370" y="298" text-anchor="middle" font-size="13.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8d8981">glibc / musl / macOS / Windows</text>
  <path d="M370,308 L370,334" fill="none" stroke="#a8a49c" stroke-width="1.9" marker-end="url(#d_ar)"/>

  <!-- 4. download bun -->
  <rect x="110" y="338" width="520" height="90" rx="11" fill="#fdf0d5" stroke="#e5c377" stroke-width="2.2"/>
  <text x="370" y="368" text-anchor="middle" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a6414">GET github.com/oven-sh/bun</text>
  <text x="370" y="392" text-anchor="middle" font-size="13.5" fill="#a67a1e">bun v1.3.13 · platform-specific .zip</text>
  <text x="370" y="414" text-anchor="middle" font-size="13.5" fill="#a67a1e" font-style="italic">an official signed binary — the network indicator is just github.com</text>
  <path d="M370,428 L370,454" fill="none" stroke="#a8a49c" stroke-width="1.9" marker-end="url(#d_ar)"/>

  <!-- 5. stage -->
  <rect x="150" y="458" width="440" height="72" rx="11" fill="#f4f2ec" stroke="#c8c3b6" stroke-width="1.5"/>
  <text x="370" y="487" text-anchor="middle" font-size="15.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#4f4c44">mkdtemp $TMPDIR/bun-dl-*</text>
  <text x="370" y="511" text-anchor="middle" font-size="14" fill="#8d8981">extract · chmod 755</text>
  <path d="M370,530 L370,556" fill="none" stroke="#a8a49c" stroke-width="1.9" marker-end="url(#d_ar)"/>

  <!-- 6. stage 2 -->
  <rect x="110" y="560" width="520" height="82" rx="11" fill="#fce8e3" stroke="#e8a798" stroke-width="2.4"/>
  <text x="370" y="590" text-anchor="middle" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#c0492b">bun Math_Symbol.js</text>
  <text x="370" y="614" text-anchor="middle" font-size="14" fill="#bd7259">stage 2 — the 727 KB worm executes</text>
  <text x="370" y="633" text-anchor="middle" font-size="13" fill="#bd7259" font-style="italic">never touches node — the runtime is Bun</text>
  <path d="M370,642 L370,666" fill="none" stroke="#a8a49c" stroke-width="1.9" marker-end="url(#d_ar)"/>

  <!-- 7. cleanup -->
  <rect x="190" y="670" width="360" height="40" rx="10" fill="#f4f2ec" stroke="#c8c3b6" stroke-width="1.5"/>
  <text x="370" y="695" text-anchor="middle" font-size="14.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8d8981">rm -rf $TMPDIR/bun-dl-*</text>
</svg>
